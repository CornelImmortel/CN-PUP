patients: configs/patients.patient_03_wxs_ctc_only_compare.tsv
caller_vcfs: configs/caller_vcfs.patient_03_wxs_ctc_only_compare.tsv
outdir: results
run_monovar: false
run_external_callers: true
run_comparison: true
run_caller_scorecard: true

# SCcaller deferred for patient_03 (author's decision, 2026-07-01): no
# pre-built hSNP VCF exists yet for this patient's bulk sample (SRR8617664),
# unlike patient01 which has one already. Scorecard here stays at 3 callers
# (MonoVar, HaplotypeCaller, DeepVariant) until that's worth building.
# sccaller_script is filled in for whenever this is revisited (same
# already-deployed tool used for the patient01 comparison, see
# vcf_bench/variant_caller_comparison.qmd) -- sccaller_hsnp_vcf is
# intentionally left blank, do not enable run_sccaller without setting it.
run_sccaller: false
sccaller_script: /tzu-share-2/users/students/cornelusp/sccaller/SCcaller-core/sccaller_v2.0.0.py
sccaller_cpu: 8
sccaller_bias: 0.75
sccaller_engine: samtools
sccaller_mode: external_bulk
sccaller_hsnp_vcf: ""

run_delsieve_prep: true
run_delsieve: false
run_delsieve_from_existing: false
run_delsieve_tree_annotator: true
run_vep_filter: true
run_snv_report: true
tissue_vcfs: configs/tissue_vcfs.patient_03_wxs_meta_leuko.tsv
min_total_depth: 20
min_alt_reads: 4
min_vaf: 0.0
delsieve_min_ctc_support: 2
delsieve_callers: all
delsieve_min_base_quality: 0
delsieve_min_mapping_quality: 0
delsieve_existing_long_table: ""
delsieve_applauncher: applauncher
delsieve_beast: beast
delsieve_treeannotator: applauncher
delsieve_template_stage1: ""
delsieve_threads: 4
delsieve_datatype: 1
delsieve_missing_threshold: 1
delsieve_sample_cells: 0
delsieve_sample_loci: 0
delsieve_ignore_sex: false
delsieve_beast_extra_args: ""
delsieve_datacollector_extra_args: ""
delsieve_tree_burnin: 10
delsieve_tree_heights: median
max_population_af: 0.001
keep_cosmic: true
genome: GRCh38
