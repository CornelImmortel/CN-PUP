patients: docs/tzu_run/patients.Pat_03_Pat_04_CTCs.monovar.tsv
outdir: results_exome_ctcs

# Execution/reporting.
enable_weblog: true
weblog_url: http://localhost:8605

# Caller branches. This run has MonoVar inputs only; SCcaller and external
# caller branches need their input files filled before enabling.
run_monovar: true
run_external_callers: false
run_sccaller: false
run_comparison: true
run_final_report: true
run_snv_report: true
run_vep_filter: true
run_bam_qc: true

# MonoVar.
monovar_script: /tzu-share-2/users/students/cornelusp/monovar/monovar/src/monovar.py
monovar_threads: 6
monovar_region: ""
# Exome-only variant of params.Pat_03_Pat_04_CTCs.monovar.yml (which uses
# canonical_chroms.bed -- essentially whole-genome, restricted only to drop
# the "phix" spike-in contig that otherwise crashes RUN_MONOVAR/
# RUN_MONOVAR_WBC_SUBSET). This run instead restricts samtools mpileup to
# GENCODE v50 exonic regions: 407,835 merged, coordinate-sorted, non-
# overlapping BED3 intervals, confirmed via
# novovene_staging/wrappers/PTATO_pat03/exonic_coverage/README.md as the
# file meant for exactly this ("ideal for exome coverage analysis") -- not
# its sibling gencode_v50_exons_raw.bed.gz, which is unmerged/overlapping
# per-transcript exons (BED6, 5M+ rows), the wrong shape for a -l target.
monovar_targets_bed: /tzu-share-2/data/TZU/novovene_staging/wrappers/PTATO_pat03/exonic_coverage/gencode_v50_exons_merged.bed.gz
# Include every CTC in the WBC germline-check joint call, not just a random
# background sample -- a variant carried only by a CTC outside the sampled
# background was never jointly genotyped with the WBC at all (shows up as
# "not_available" rather than a real coverage/genotype answer in the detail
# workbook). PREPARE_MONOVAR_WBC_SUBSET caps this at the actual CTC count
# per patient (`min(ctc_count, len(ctcs))`), so one large number works for
# every patient regardless of how many CTCs they have.
monovar_background_ctc_count: 99
monovar_background_seed: 13

# Optional external/SCcaller inputs. Leave branches off unless these point to
# real files for this patient.
caller_vcfs: configs/caller_vcfs.tsv
tissue_vcfs: ""
sccaller_script: ""
sccaller_cpu: 8
sccaller_bias: 0.75
sccaller_engine: samtools
sccaller_mode: external_bulk
sccaller_hsnp_vcf: ""

# Variant filtering.
min_total_depth: 20
min_alt_reads: 4
min_vaf: 0.0
max_population_af: 0.001
keep_cosmic: true

# VEP population/COSMIC annotation and filtering.
genome: GRCh38
vep_species: homo_sapiens
vep_cache: /home/cornelusp/.vep
vep_cache_version: "115"
vep_fasta: /tzu-share-2/resources/genome/fasta_sarek/Homo_sapiens_assembly38.fasta
vep_forks: 2
vep_buffer_size: 5000
vep_sites_per_chunk: 5000

# Final reports.
final_report_top_variants: 200
final_report_rarefaction_iterations: 200

# BAM-level QC and MultiQC. Restricted to the same exome BED as
# monovar_targets_bed above, so coverage breadth/depth stats are scoped
# consistently with the exome-restricted variant calls (unlike the WGS
# sibling config, which leaves this empty since mosdepth covers the whole
# genome there).
mosdepth_threads: 2
mosdepth_by: /tzu-share-2/data/TZU/novovene_staging/wrappers/PTATO_pat03/exonic_coverage/gencode_v50_exons_merged.bed.gz

# DelSIEVE prep and stage 1 run.
run_delsieve_prep: false
run_delsieve: false
run_delsieve_from_existing: false
run_delsieve_tree_annotator: true
run_delsieve_tree_png: true
run_delsieve_variant_caller: true
run_delsieve_gene_annotator: true
delsieve_min_ctc_support: 2
delsieve_callers: all
delsieve_min_base_quality: 0
delsieve_min_mapping_quality: 0
delsieve_existing_long_table: ""
delsieve_applauncher: /tzu-share-2/users/students/cornelusp/beast/bin/applauncher
delsieve_beast: /tzu-share-2/users/students/cornelusp/beast/bin/beast
delsieve_treeannotator: /tzu-share-2/users/students/cornelusp/beast/bin/applauncher
delsieve_version_file: ""
delsieve_template_stage1: /tzu-share-2/users/students/cornelusp/CN-PUP3/configs/delsieve_smc_mu_sa_stage_1.fixed.xml
delsieve_threads: 4
delsieve_datatype: 1
delsieve_missing_threshold: 1
delsieve_sample_cells: 0
delsieve_sample_loci: 0
delsieve_ignore_sex: false
delsieve_beast_extra_args: ""
delsieve_datacollector_extra_args: ""
delsieve_tree_burnin: 10
delsieve_tree_heights: median
delsieve_variant_burnin: 10
delsieve_variant_estimates: median
delsieve_variant_extra_args: ""
delsieve_figtree: figtree
delsieve_figtree_extra_args: ""
delsieve_mutation_map: ""
delsieve_geneannotator_subst: 1
delsieve_mutation_map_annovar: false
delsieve_annovar_separator: 0
delsieve_annovar_filter_col: -1
delsieve_annovar_filter_keywords: ""
delsieve_gene_filter: ""
delsieve_gene_filter_sep: 0
delsieve_gene_filter_col: 0
delsieve_geneannotator_extra_args: ""
